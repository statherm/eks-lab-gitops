# ArgoCD child Application: External Secrets Operator (ESO). Sync wave 0 — must exist before
# config/sample/ (wave 1), which contains a ClusterSecretStore + ExternalSecret.
#
# Chart: external-secrets/external-secrets 2.14.0 (appVersion v2.14.0), https://charts.external-secrets.io
# (verified 2026-11-08 with `helm search repo external-secrets/external-secrets --versions`; latest).
# Values key paths checked against the pulled chart's values.yaml:
#   installCRDs: true                  (default true; kept explicit per the contract)
#   serviceAccount.{create,name,annotations}
#   crds.unsafeServeV1Beta1: false     (default) -> only external-secrets.io/v1 is served;
#                                      v1beta1 is deprecated and "will be removed on 2026.05.01".
#
# IRSA: eks-lab-irsa-external-secrets -> external-secrets/external-secrets
#   (secretsmanager:GetSecretValue + DescribeSecret on the eks-lab/sample secret).
# The ClusterSecretStore in config/sample/ references THIS service account via auth.jwt.serviceAccountRef,
# so ESO mints a projected token for it and exchanges it for the role above.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::859741818496:role/eks-lab-irsa-external-secrets
        # One-day lab: a single replica of each controller is plenty and halves the pod count.
        replicaCount: 1
        webhook:
          replicaCount: 1
        certController:
          replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO's ExternalSecret/ClusterSecretStore CRDs are far larger than the 262144-byte
      # last-applied-configuration annotation limit; client-side apply fails with
      # "metadata.annotations: Too long". Server-side apply is the documented fix.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
