# output of 00-account). ArgoCD ignores this .tpl file; only the rendered .yaml is applied.
#
# KEDA ScaledObject: scale the `consumer` Deployment 0..10 on the depth of eks-lab-dials.
# API keda.sh/v1alpha1; spec fields verified against chart 2.21.0 crd-scaledobjects.yaml
# (scaleTargetRef, pollingInterval, cooldownPeriod, minReplicaCount, maxReplicaCount, triggers).
# Trigger metadata keys per keda.sh/docs/2.21/scalers/aws-sqs/: queueURL, queueLength, awsRegion
# (plus optional activationQueueLength, scaleOnInFlight (default true), scaleOnDelayed (default false)).
#
# Semantics: HPA target = queueLength messages per replica, so 50 messages -> 10 replicas (capped).
# minReplicaCount 0 -> KEDA scales to zero when the queue is empty (after cooldownPeriod 60 s) and
# activates 0->1 itself (the HPA cannot go below 1; KEDA handles the 0<->1 transition).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dial-consumer
  namespace: sample
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: consumer
  pollingInterval: 10
  cooldownPeriod: 60
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: aws-pod-identity
      metadata:
        queueURL: https://sqs.us-west-2.amazonaws.com/859741818496/eks-lab-dials
        queueLength: "5"
        awsRegion: us-west-2
        # identityOwner: operator   <- contract wording; DEPRECATED since KEDA 2.13 and only read by the
        #                              aws-eks provider. The `aws` provider takes it from
        #                              TriggerAuthentication.spec.podIdentity.identityOwner (= keda).
