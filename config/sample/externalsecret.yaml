# ExternalSecret: pulls Secrets Manager secret `eks-lab/sample` (a random_password string created by
# 00-account) into the k8s Secret `sample-secret` every hour. The remote value is a plain string, not
# JSON, so `data` + `remoteRef.key` is used (dataFrom.extract would require a JSON document).
# Resulting Secret key: SAMPLE_SECRET (consumed by the web Deployment as an env var).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-secret
  namespace: sample
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: sample-secret
    creationPolicy: Owner
  data:
    - secretKey: SAMPLE_SECRET
      remoteRef:
        key: eks-lab/sample
