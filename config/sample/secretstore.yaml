# ESO ClusterSecretStore -> AWS Secrets Manager, us-west-2, authenticating as the ESO controller's
# own IRSA-annotated ServiceAccount (external-secrets/external-secrets -> eks-lab-irsa-external-secrets).
# API: external-secrets.io/v1 — the only version served by chart 2.14.0 (v1beta1 is deprecated,
# off by default via crds.unsafeServeV1Beta1=false, removal announced for 2026-05-01).
# "In case of a ClusterSecretStore, be sure to provide namespace for serviceAccountRef"
# (external-secrets.io/latest/provider/aws-access/).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
