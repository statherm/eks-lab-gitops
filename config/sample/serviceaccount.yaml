# IRSA: the consumer pods run as this SA; the EKS pod-identity webhook injects the projected
# web-identity token and AWS_ROLE_ARN, so boto3 assumes eks-lab-irsa-dial-consumer
# (sqs:ReceiveMessage / DeleteMessage / GetQueueAttributes / ChangeMessageVisibility on eks-lab-dials).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dial-consumer
  namespace: sample
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::859741818496:role/eks-lab-irsa-dial-consumer
automountServiceAccountToken: true
